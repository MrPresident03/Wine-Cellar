name: CI
on:
  push:
    branches: [house-of-vino]
    paths-ignore: ['docs/**', '**/*.md', 'legacy/**', 'firmware/**']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4

jobs:
  android-jvm:
    name: Android + JVM tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --stacktrace --continue \
            :shared:core:jvmTest :shared:data:jvmTest :shared:ui:desktopTest \
            :androidApp:assembleDebug 2>&1 | tee build.log
      - name: Collect results
        if: always()
        run: python3 tools/ci/collect.py android-jvm build.log out 'build/screenshots/**/*.png'
      - name: Publish results
        if: always()
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: tools/ci/publish.sh ci/android-jvm out
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: house-of-vino-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1

  ios:
    name: iOS build + simulator tests (macOS)
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Toolchain info
        run: |
          ls -d /Applications/Xcode*.app | tee xcode.txt
          xcodebuild -version | tee -a xcode.txt
          xcrun simctl list devices available | grep -E 'iPhone' | head -5 | tee -a xcode.txt
      - name: Kotlin iOS tests and framework
        id: kotlin
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --stacktrace --continue \
            :shared:core:iosSimulatorArm64Test :shared:data:iosSimulatorArm64Test \
            :shared:ui:linkDebugFrameworkIosSimulatorArm64 2>&1 | tee build.log
      - name: Xcode build
        id: xcode
        if: steps.kotlin.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd iosApp && xcodegen generate
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../xcode.log | grep -E 'error:|warning: .*HouseOfVino|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' ../xcode.log
      - name: Collect results
        if: always()
        run: |
          cat xcode.log >> build.log 2>/dev/null || true
          python3 tools/ci/collect.py ios build.log out xcode.txt
      - name: Publish results
        if: always()
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: tools/ci/publish.sh ci/ios out
      - name: Fail if the build failed
        if: steps.kotlin.outcome != 'success' || steps.xcode.outcome != 'success'
        run: exit 1
